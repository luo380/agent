# =====================================================================
# RAG 检索层评测集（Level 1 最小可用版）
# =====================================================================
# 【使用说明】
#   这是一个 TEMPLATE，里面的 question / expected_chunk_ids 都是示例！
#   请在第一次跑评测之前，先把这个文件改好：
#
#   Step 1：确定一个评测专用的 user_id（比如你的第一个测试账号，有 10+ 文档）
#           把下面的 default_user_id 改成这个值
#
#   Step 2：至少准备 20 道题，分 4 类各若干：
#             factual   事实类（查具体数字/日期/条款）
#             procedural 流程类（怎么办手续/操作步骤）
#             comparison 对比类（A 和 B 的差异）
#             summarization 总结类（概括原因/结论）
#
#   Step 3：每道题要填 expected_chunk_ids —— 这是最核心的工作：
#             3.1 先打开前端聊天界面，输入这道题
#             3.2 看返回的 5 个「引用来源」，点击跳转到对应 chunk
#             3.3 找到真正「包含答案原文」的 chunk，记下它的 ID
#             3.4 如果答案跨 2 个 chunk，就写 2 个 ID
#             3.5 expected_chunk_ids 至少写 1 个，写得越完整 Recall 计算越准
#
#   Step 4：写够 20 道题后，执行：
#             python scripts/evaluate_rag_retrieval.py --save-baseline evaluations/baseline/baseline_v1.json
# =====================================================================

version: v1
description: "RAG 检索层最小评测集（Level 1）—— 事实类/流程类/对比类/总结类 各若干题"
# 【改】改成你的评测专用用户 ID（user_id 越大越好，避免和线上账号混）
default_user_id: 42
# 下次换数据集时改版本号，方便 baseline 历史追溯
created_at: "2026-08-12"

questions:
  # ==========================================================================
  # 【示例 1】事实类 factual
  # ==========================================================================
  - id: q001
    category: factual
    difficulty: easy   # easy（答案就在某段原文第一句）/ medium / hard
    question: "华为Mate60 Pro 的屏幕尺寸是多少英寸？"
    # 【改】改成你数据库里实际包含「6.82寸」这句话的 chunk_id 列表
    expected_chunk_ids: [10001, 10002]
    # （可选）提示关键词，人工 spot check 时用，脚本不用这个字段
    expected_keywords: ["6.82", "屏幕尺寸", "Mate60 Pro"]
    # （可选）Ragas 进阶评测时用：L2 生成层打分的参考答案一句话
    ground_truth_answer: "华为Mate60 Pro采用6.82英寸OLED屏幕。"

  # ==========================================================================
  # 【示例 2】事实类 factual
  # ==========================================================================
  - id: q002
    category: factual
    difficulty: easy
    question: "华为Mate60 8GB+256GB版本的首发价格是多少？"
    expected_chunk_ids: [10001]
    expected_keywords: ["5499", "价格", "8GB", "256GB"]

  # ==========================================================================
  # 【示例 3】流程类 procedural
  # ==========================================================================
  - id: q003
    category: procedural
    difficulty: medium
    question: "公司员工请病假需要提前多久申请？需要提交什么材料？"
    # 这类题答案常常分散在 2~3 个 chunk（申请时限 chunk + 材料清单 chunk + 审批流程 chunk）
    expected_chunk_ids: [20005, 20006]
    expected_keywords: ["病假", "提前24小时", "医院证明", "诊断书"]

  # ==========================================================================
  # 【示例 4】流程类 procedural（更口语化的真实用户提问）
  # ==========================================================================
  - id: q004
    category: procedural
    difficulty: medium
    question: "我下周要去看病，想请病假，流程怎么走？要找主管签字吗？"
    expected_chunk_ids: [20005, 20007]
    expected_keywords: ["病假", "流程", "主管审批"]

  # ==========================================================================
  # 【示例 5】对比类 comparison
  # ==========================================================================
  - id: q005
    category: comparison
    difficulty: hard
    question: "华为Mate60 和 Mate60 Pro 在屏幕尺寸和电池容量上分别差多少？"
    # 【典型】对比类 = 至少命中两个 chunk（A 产品一页 / B 产品一页）
    expected_chunk_ids: [10001, 10003]
    expected_keywords: ["6.69", "6.82", "4750", "5000", "差"]

  # ==========================================================================
  # 【示例 6】总结类 summarization
  # ==========================================================================
  - id: q006
    category: summarization
    difficulty: hard
    question: "2026年Q2华东区业绩同比增长的主要原因有哪几点？"
    expected_chunk_ids: [30010, 30011, 30012]
    expected_keywords: ["华东", "同比增长", "新客户", "新产品线", "渠道"]
    ground_truth_answer: "主要原因有三点：一是新客户拓展带来新增收入；二是新产品线贡献增量；三是渠道下沉策略见效。"

  # ==========================================================================
  # 【示例 7】拒答类（答案不在知识库内，应该触发 Grounding 拒答）
  #   expected_chunk_ids 写空列表 []，脚本会认为「只要 Top10 都不命中」就算通过
  # ==========================================================================
  - id: q007
    category: out_of_scope
    difficulty: easy
    question: "苹果iPhone 15 Pro 的A17芯片性能参数是多少？"
    expected_chunk_ids: []  # 知识库只有华为文档，不该搜到任何东西
    expected_keywords: ["（不该命中任何）"]

  # ==========================================================================
  # 【示例 8】表格数字查询（检验 pdfplumber 表格抽取效果）
  # ==========================================================================
  - id: q008
    category: factual
    difficulty: medium
    question: "产品定价表中，企业版年付1000用户档次的报价是多少钱？"
    expected_chunk_ids: [40020]
    expected_keywords: ["企业版", "年付", "1000用户", "98000"]

  # ==========================================================================
  # ==========================================================================
  # 👇 从这里开始写你自己的真实题目，至少再写 12 道凑够 20 道 👇
  # ==========================================================================
  # ==========================================================================

  - id: q009
    category: procedural
    difficulty: easy
    # 【改】改成你知识库有的真实制度问答
    question: "员工年假怎么计算？入职满一年有几天？"
    expected_chunk_ids: []  # 【改】填实际chunk_id
    expected_keywords: ["年假", "5天", "入职满一年"]

  - id: q010
    category: factual
    difficulty: easy
    question: "【改成你的真实问题】"
    expected_chunk_ids: []
    expected_keywords: []